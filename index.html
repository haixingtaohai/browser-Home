<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <!-- 站点图标，避免浏览器请求 /favicon.ico 时 404 -->
  <link rel="icon" href="index-imgs/yjs.ico">
  <!-- 页面样式（外部 CSS） -->
  <link rel="stylesheet" href="index_css.css">
</head>
<body>
  <div class="glass-card">
    <!-- 问候 + 实时时钟 -->
    <div class="greeting-section">
      <div class="greeting-left">
        <span class="icon-badge"><img class="svg-icon" src="icons/ui-compass.svg" alt=""></span>
        <span id="greetingMsg"></span>
      </div>
      <div class="live-time" id="liveClock">--:--:--</div>
    </div>

    <!-- 搜索引擎切换区（默认必应，刷新后恢复上次选择） -->
    <div class="engine-switcher" id="engineSwitcher">
      <button class="engine-btn active" data-engine="bing"><img class="svg-icon" src="icons/bing.svg" alt=""> Bing</button>
      <button class="engine-btn" data-engine="google"><img class="svg-icon" src="icons/google.svg" alt=""> Google</button>
      <button class="engine-btn" data-engine="baidu"><img class="svg-icon" src="icons/baidu.svg" alt=""> 百度</button>
      <button class="engine-btn" data-engine="yandex"><img class="svg-icon" src="icons/yandex.svg" alt=""> Yandex</button>
      <button class="engine-btn" data-engine="sogou"><img class="svg-icon" src="icons/sogou.svg" alt=""> 搜狗</button>
      <button class="engine-btn" data-engine="so360"><img class="svg-icon" src="icons/so360.svg" alt=""> 360</button>
      <button class="engine-btn" data-engine="github"><img class="svg-icon" src="icons/github-engine.svg" alt=""> GitHub</button>
    </div>

    <!-- 搜索框区域（核心） -->
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Bing 搜索">
      <button type="submit" class="search-btn" aria-label="搜索"><img class="svg-icon" src="icons/ui-search.svg" alt=""></button>
    </form>

    <!-- 常用网站标题 -->
    <div class="links-title">
      <span class="icon-badge"><img class="svg-icon" src="icons/ui-star.svg" alt=""></span>
      <span class="links-title-text">快捷导航</span>
    </div>

    <!-- 网址网格动态生成（保持代码简洁，用JS注入） -->
    <div class="links-grid" id="linksGrid"></div>

    <!-- 装饰脚注 -->
    <div class="footer-note">
      <img class="svg-icon" src="icons/ui-heart.svg" alt="">&nbsp;凌ling妻
    </div>
  </div>

  <!-- 左下角局域网导航面板 -->
  <div class="lan-panel" id="lanPanel">
    <div class="lan-title">
      <span class="icon-badge"><img class="svg-icon" src="icons/ui-lan.svg" alt=""></span>
      <span>局域网</span>
    </div>
    <div class="lan-links" id="lanLinks"></div>
  </div>

  <!-- 页面脚本（外部 JS） -->
  <script src="index_js.js"></script>
</body>
</html>
