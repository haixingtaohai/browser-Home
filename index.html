<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <!-- Font Awesome 6（免费图标库） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- 站点图标，避免浏览器请求 /favicon.ico 时 404 -->
  <link rel="icon" href="index-imgs/yjs.ico">
  <!-- 页面样式（外部 CSS） -->
  <link rel="stylesheet" href="index_css.css">
</head>
<body>
  <div class="glass-card">
    <!-- 问候 + 实时时钟 -->
    <div class="greeting-section">
      <div class="greeting-left">
        <i class="fa-regular fa-compass"></i>
        <span id="greetingMsg"></span>
      </div>
      <div class="live-time" id="liveClock">--:--:--</div>
    </div>

    <!-- 搜索引擎切换区（默认必应，刷新后恢复上次选择） -->
    <div class="engine-switcher" id="engineSwitcher">
      <button class="engine-btn active" data-engine="bing"><i class="fab fa-microsoft"></i> Bing</button>
      <button class="engine-btn" data-engine="google"><i class="fab fa-google"></i> Google</button>
      <button class="engine-btn" data-engine="baidu"><i class="fa-solid fa-paw"></i> 百度</button>
      <button class="engine-btn" data-engine="yandex"><i class="fab fa-yandex"></i> Yandex</button>
      <button class="engine-btn" data-engine="sogou"><i class="fa-solid fa-dog"></i> 搜狗</button>
      <button class="engine-btn" data-engine="so360"><i class="fa-solid fa-shield"></i> 360</button>
      <button class="engine-btn" data-engine="github"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>

    <!-- 搜索框区域（核心） -->
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Bing 搜索">
      <button type="submit" class="search-btn" aria-label="搜索"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>

    <!-- 常用网站标题 -->
    <div class="links-title">
      <i class="fa-regular fa-star"></i>
      <span>快捷导航</span>
    </div>

    <!-- 网址网格动态生成（保持代码简洁，用JS注入） -->
    <div class="links-grid" id="linksGrid"></div>

    <!-- 装饰脚注 -->
    <div class="footer-note">
      <i class="fa-regular fa-heart" style="color: #f43f5e;">&nbsp;</i>凌ling妻
    </div>
  </div>

  <!-- 左下角局域网导航面板 -->
  <div class="lan-panel" id="lanPanel">
    <div class="lan-title">
      <i class="fa-solid fa-network-wired"></i>
      <span>局域网</span>
    </div>
    <div class="lan-links" id="lanLinks"></div>
  </div>

  <!-- 页面脚本（外部 JS） -->
  <script src="index_js.js"></script>
</body>
</html>
