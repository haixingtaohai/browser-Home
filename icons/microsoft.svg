<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Microsoft Logo</title>

  <!-- ① 白色圆角底板 -->
  <rect width="1024" height="1024" rx="229" ry="229" fill="#FFFFFF"/>

  <!-- ② 四色方块：官方标准色 红 #F25022 / 绿 #7FBA00 / 蓝 #00A4EF / 黄 #FFB900 -->
  <g>
    <rect x="192.00" y="192.00" width="304.16" height="304.16" fill="#F25022"/>
    <rect x="527.84" y="192.00" width="304.16" height="304.16" fill="#7FBA00"/>
    <rect x="192.00" y="527.84" width="304.16" height="304.16" fill="#00A4EF"/>
    <rect x="527.84" y="527.84" width="304.16" height="304.16" fill="#FFB900"/>
  </g>
</svg>
