<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>QQ音乐 App Icon</title>
  <defs>
    <!-- 底板：白色圆角卡片，向下微微转冷灰 -->
    <linearGradient id="qqBase" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F7F7"/>
    </linearGradient>
    <!-- 边缘一圈极浅灰色描边（自下而上由浅到更浅） -->
    <linearGradient id="qqEdge" gradientUnits="userSpaceOnUse" x1="0" y1="820" x2="0" y2="204">
      <stop offset="0" stop-color="#E3E5E5"/>
      <stop offset="1" stop-color="#EDEDED"/>
    </linearGradient>
    <!-- 主体黄圆：按官方图实测的径向剖面（中心稍深 → 中部 #FCDC06 → 外圈提亮 → 最外一道玻璃反光） -->
    <radialGradient id="qqYellow" gradientUnits="userSpaceOnUse" cx="511" cy="513" r="410">
      <stop offset="0" stop-color="#F9DA03"/>
      <stop offset="0.09" stop-color="#F9DB04"/>
      <stop offset="0.37" stop-color="#FADB04"/>
      <stop offset="0.73" stop-color="#FCDC06"/>
      <stop offset="0.835" stop-color="#FFDF08"/>
      <stop offset="0.895" stop-color="#FFE102"/>
      <stop offset="0.925" stop-color="#FFE208"/>
      <stop offset="0.944" stop-color="#FFE306"/>
      <stop offset="0.954" stop-color="#FFE508"/>
      <stop offset="0.964" stop-color="#FFF51B"/>
      <stop offset="0.973" stop-color="#FFFF2E"/>
      <stop offset="0.983" stop-color="#FFE410"/>
      <stop offset="0.995" stop-color="#FFE60F"/>
      <stop offset="1" stop-color="#FFE411"/>
    </radialGradient>
    <!-- 只有正下方那一段外圈转成灰绿暗环（球面落影），上半圈不着色 -->
    <linearGradient id="qqShade" gradientUnits="userSpaceOnUse" x1="511" y1="120" x2="511" y2="920">
      <stop offset="0" stop-color="#7E9E10" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#7E9E10" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#7E9E10" stop-opacity="0.05"/>
      <stop offset="0.88" stop-color="#7E9E10" stop-opacity="0.15"/>
      <stop offset="0.9625" stop-color="#7E9E10" stop-opacity="0.22"/>
      <stop offset="0.985" stop-color="#7E9E10" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7E9E10" stop-opacity="0.1"/>
    </linearGradient>
    <!-- 音符左缘的高光带（软边，自上而下由青转翠、到底部淡出） -->
    <linearGradient id="qqGloss" gradientUnits="userSpaceOnUse" x1="512" y1="235" x2="512" y2="880">
      <stop offset="0" stop-color="#2FE2C8" stop-opacity="0"/>
      <stop offset="0.04" stop-color="#30E4C9" stop-opacity="0.95"/>
      <stop offset="0.17" stop-color="#37E1BA" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#40E0AC" stop-opacity="1"/>
      <stop offset="0.44" stop-color="#4ADF9F" stop-opacity="1"/>
      <stop offset="0.63" stop-color="#5DF9B0" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#43E79D" stop-opacity="0.9"/>
      <stop offset="0.78" stop-color="#35E096" stop-opacity="0.8"/>
      <stop offset="0.88" stop-color="#25D98D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#20CC80" stop-opacity="0"/>
    </linearGradient>
    <filter id="qqSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- 高光只保留笔画左侧 8~22px 的那一条带（软边） -->
    <mask id="qqGlossMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g filter="url(#qqSoft)">
        <path d="M528.0 886.9C653.5 875.5 734.2 762.8 685.8 666.7C683.7 662.3 642.7 591.3 594.9 508.8C547.0 426.3 508.0 358.7 508.2 358.6C508.4 358.5 513.7 355.5 520.0 352.0C608.2 303.4 689.2 215.9 726.0 129.5C731.4 116.9 736.9 102.0 736.3 102.0C736.0 102.0 729.4 106.2 721.6 111.4C637.9 167.0 539.0 193.4 402.5 196.6C378.6 197.2 374.0 197.5 371.0 199.0C360.7 204.3 356.2 216.3 360.9 226.5C362.4 229.7 554.2 561.3 561.3 572.9L563.4 576.3 560.6 575.6C479.9 555.4 379.9 598.9 343.5 670.1C287.2 780.2 388.8 899.7 528.0 886.9Z" fill="#FFFFFF" transform="translate(8,0)"/>
        <path d="M528.0 886.9C653.5 875.5 734.2 762.8 685.8 666.7C683.7 662.3 642.7 591.3 594.9 508.8C547.0 426.3 508.0 358.7 508.2 358.6C508.4 358.5 513.7 355.5 520.0 352.0C608.2 303.4 689.2 215.9 726.0 129.5C731.4 116.9 736.9 102.0 736.3 102.0C736.0 102.0 729.4 106.2 721.6 111.4C637.9 167.0 539.0 193.4 402.5 196.6C378.6 197.2 374.0 197.5 371.0 199.0C360.7 204.3 356.2 216.3 360.9 226.5C362.4 229.7 554.2 561.3 561.3 572.9L563.4 576.3 560.6 575.6C479.9 555.4 379.9 598.9 343.5 670.1C287.2 780.2 388.8 899.7 528.0 886.9Z" fill="#000000" transform="translate(22,0)"/>
      </g>
    </mask>
    <!-- 音符：由青绿到翠绿的竖向渐变（按官方图标逐行取色） -->
    <linearGradient id="qqNote" gradientUnits="userSpaceOnUse" x1="512" y1="102" x2="512" y2="890">
      <stop offset="0" stop-color="#26DECD"/>
      <stop offset="0.1" stop-color="#0ED0C2"/>
      <stop offset="0.25" stop-color="#1ACBAA"/>
      <stop offset="0.4" stop-color="#2ACB98"/>
      <stop offset="0.51" stop-color="#31CA8B"/>
      <stop offset="0.63" stop-color="#32C780"/>
      <stop offset="0.76" stop-color="#18BF76"/>
      <stop offset="0.89" stop-color="#08BE72"/>
      <stop offset="1" stop-color="#0CC578"/>
    </linearGradient>
  </defs>

  <!-- ① 圆角底板 -->
  <rect width="1024" height="1024" rx="229" ry="229" fill="url(#qqBase)"/>
  <!-- ② 极浅灰内描边，还原原图四周的柔和包边 -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="228" ry="228" fill="none" stroke="url(#qqEdge)" stroke-width="3"/>

  <!-- ③ 黄色主圆 + 底部外圈的灰绿落影 -->
  <circle cx="511" cy="513" r="410" fill="url(#qqYellow)"/>
  <circle cx="511" cy="513" r="392" fill="none" stroke="url(#qqShade)" stroke-width="36"/>
  <!-- ④ 音符 + 左缘高光 -->
  <path fill="url(#qqNote)" d="M528.0 886.9C653.5 875.5 734.2 762.8 685.8 666.7C683.7 662.3 642.7 591.3 594.9 508.8C547.0 426.3 508.0 358.7 508.2 358.6C508.4 358.5 513.7 355.5 520.0 352.0C608.2 303.4 689.2 215.9 726.0 129.5C731.4 116.9 736.9 102.0 736.3 102.0C736.0 102.0 729.4 106.2 721.6 111.4C637.9 167.0 539.0 193.4 402.5 196.6C378.6 197.2 374.0 197.5 371.0 199.0C360.7 204.3 356.2 216.3 360.9 226.5C362.4 229.7 554.2 561.3 561.3 572.9L563.4 576.3 560.6 575.6C479.9 555.4 379.9 598.9 343.5 670.1C287.2 780.2 388.8 899.7 528.0 886.9Z"/>
  <path fill="url(#qqGloss)" mask="url(#qqGlossMask)" d="M528.0 886.9C653.5 875.5 734.2 762.8 685.8 666.7C683.7 662.3 642.7 591.3 594.9 508.8C547.0 426.3 508.0 358.7 508.2 358.6C508.4 358.5 513.7 355.5 520.0 352.0C608.2 303.4 689.2 215.9 726.0 129.5C731.4 116.9 736.9 102.0 736.3 102.0C736.0 102.0 729.4 106.2 721.6 111.4C637.9 167.0 539.0 193.4 402.5 196.6C378.6 197.2 374.0 197.5 371.0 199.0C360.7 204.3 356.2 216.3 360.9 226.5C362.4 229.7 554.2 561.3 561.3 572.9L563.4 576.3 560.6 575.6C479.9 555.4 379.9 598.9 343.5 670.1C287.2 780.2 388.8 899.7 528.0 886.9Z"/>
</svg>
